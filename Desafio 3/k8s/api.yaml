apiVersion: v1
kind: Service
metadata:
  name: desafio01
spec:
  type: NodePort
  selector:
    app: desafio01
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desafio01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: desafio01
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      containers:
        - name: desafio01
          image: desafio01:latest
          imagePullPolicy: IfNotPresent 
          envFrom:
            - configMapRef:
                name: desafio01-config
            - secretRef:
                name: desafio01-secret
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
            limits:
              cpu: "200m"
